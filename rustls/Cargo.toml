[package]
name = "craftls"
version = "0.0.3+rustls.0.23.0"
edition = "2021"
rust-version = "1.66"
license = "Apache-2.0 OR ISC OR MIT"
readme = "../README.md"
description = "Craftls is a fork of Rustls with customizable ClientHello fingerprint and pluggable CryptoProvider for WASM compatibility."
homepage = "https://github.com/3andne/craftls"
repository = "https://github.com/3andne/craftls"
categories = ["network-programming", "cryptography"]
autobenches = false
build = "build.rs"

[lib]
name = "rustls"

[build-dependencies]
rustversion = { version = "1.0.6", optional = true }

[dependencies]
# Optional native crypto providers (not WASM compatible)
aws-lc-rs = { version = "1.5", optional = true }
ring = { version = "0.17", optional = true }

# Core dependencies
log = { version = "0.4.4", optional = true }
subtle = { version = "2.5.0", default-features = false }
webpki = { package = "rustls-webpki", version = "0.102", features = ["std"], default-features = false }
pki-types = { package = "rustls-pki-types", version = "1", features = ["std"] }
zeroize = "1.6.0"

# Craft-specific dependencies
once_cell = "1.18" #!craft! - WASM-compatible lazy initialization
paste = "1.0.14" #!craft!
rand = { version = "0.8.5", default-features = false } #!craft! - made no_std compatible
getrandom = { version = "0.2", optional = true } #!craft! - for WASM random

# Compression (optional for WASM)
brotli = { version = "3.4.0", optional = true }
flate2 = { version = "1.0.28", optional = true }
zstd = { version = "0.12.3", optional = true }
home = { version = "=0.5.5", optional = true } #!craft! to minimize MSRV

[features]
# Default: no crypto provider, user must provide one (or use ring/aws_lc_rs features)
default = ["logging", "tls12", "std", "compression"]

# Standard library support (disable for no_std/WASM core)
std = ["rand/std", "rand/std_rng", "home"]

# Logging support
logging = ["log"]

# Native crypto providers (not WASM compatible)
aws_lc_rs = ["dep:aws-lc-rs", "webpki/aws_lc_rs"]
ring = ["dep:ring", "webpki/ring"]

# TLS version support
tls12 = []

# Compression algorithms
compression = ["brotli", "flate2", "zstd"]

# WASM compatibility mode - use with external CryptoProvider like rustls-rustcrypto
wasm = ["getrandom/js"]

# Nightly features
read_buf = ["rustversion"]

[dev-dependencies]
base64 = "0.21"
bencher = "0.1.5"
env_logger = "0.10"
log = "0.4.4"
rustls-pemfile = "2"
webpki-roots = "0.26"

[[example]]
name = "bogo_shim"
path = "examples/internal/bogo_shim.rs"
required-features = ["tls12"]

[[example]]
name = "bench"
path = "examples/internal/bench.rs"

[[bench]]
name = "benchmarks"
path = "benches/benchmarks.rs"
harness = false
required-features = ["ring"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    "rustls_pki_types::*",
]
